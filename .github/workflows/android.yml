
name: Build SL WEATHER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: gradle -p . assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SL-WEATHER-APK
          path: app/build/outputs/apk/debug/*.apk
